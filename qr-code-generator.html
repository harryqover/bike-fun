<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR Generator</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Using the verified working qrcodejs library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }
                    },
                    boxShadow: {
                        'glass': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(217,100%,76%,0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, hsla(253,100%,76%,0.15) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        /* Custom Webkit Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Smooth UI transitions */
        .input-transition { transition: all 0.2s ease; }
        
        /* Toast Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translate(-50%, 0); }
            to { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-enter { animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: fadeOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* QR Code Container Styling */
        #qr-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Force the high-res generated canvas and image to fit our UI boundaries */
        #qr-container canvas,
        #qr-container img {
            width: 100% !important;
            height: 100% !important;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-500 selection:text-white pb-20 md:pb-0 flex items-center justify-center">

    <main class="container mx-auto px-4 py-12 max-w-5xl">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold tracking-tight text-slate-900 mb-2">QR Studio</h1>
            <p class="text-slate-500">Generate, customize, and export high-quality QR codes instantly.</p>
        </header>

        <div class="bg-white/70 backdrop-blur-xl border border-slate-200/60 rounded-3xl shadow-glass overflow-hidden grid grid-cols-1 md:grid-cols-12 gap-0 relative">
            
            <!-- Left Column: Controls -->
            <div class="md:col-span-7 p-6 md:p-10 border-b md:border-b-0 md:border-r border-slate-200/60 flex flex-col gap-8">
                
                <!-- Input Section -->
                <div class="space-y-3">
                    <label for="qr-data" class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <i data-lucide="link" class="w-4 h-4 text-brand-500"></i> Content
                    </label>
                    <textarea id="qr-data" rows="3" 
                        class="w-full bg-white/50 border border-slate-300 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 input-transition resize-none"
                        placeholder="Enter a URL, text, email, or wifi credentials..."
                    >https://github.com</textarea>
                </div>

                <!-- Customization Grid -->
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-3">
                        <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                            <i data-lucide="palette" class="w-4 h-4 text-slate-400"></i> Foreground
                        </label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="color-dark" value="#0f172a" class="w-10 h-10 rounded-lg cursor-pointer border-0 p-0 bg-transparent">
                            <span class="text-sm text-slate-500 font-mono uppercase" id="color-dark-label">#0F172A</span>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                            <i data-lucide="droplet" class="w-4 h-4 text-slate-400"></i> Background
                        </label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="color-light" value="#ffffff" class="w-10 h-10 rounded-lg cursor-pointer border-0 p-0 bg-transparent">
                            <span class="text-sm text-slate-500 font-mono uppercase" id="color-light-label">#FFFFFF</span>
                        </div>
                    </div>
                </div>

                <!-- Logo / Icon Section -->
                <div class="space-y-3">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <i data-lucide="image" class="w-4 h-4 text-slate-400"></i> Logo / Center Image
                        <span class="text-xs font-normal text-slate-400 ml-auto">Optional</span>
                    </label>

                    <div id="logo-dropzone" class="border-2 border-dashed border-slate-300 rounded-2xl p-4 text-center hover:border-brand-500 transition-colors cursor-pointer bg-slate-50/50 flex flex-col items-center justify-center relative group">
                        <input type="file" id="logo-file" accept="image/*" class="hidden">
                        
                        <!-- Upload Prompt -->
                        <div id="logo-upload-prompt" class="flex flex-col items-center gap-1.5 py-2">
                            <i data-lucide="upload-cloud" class="w-6 h-6 text-slate-400 group-hover:text-brand-500 transition-colors"></i>
                            <span class="text-xs font-medium text-slate-600">Click or drag & drop image here</span>
                            <span class="text-[10px] text-slate-400">PNG, JPG, SVG, WebP (Max 5MB)</span>
                        </div>

                        <!-- Logo Preview -->
                        <div id="logo-preview-container" class="hidden flex items-center justify-between w-full">
                            <div class="flex items-center gap-3">
                                <img id="logo-preview-img" class="w-10 h-10 object-contain rounded-lg border border-slate-200 bg-white p-1 shadow-sm" src="" alt="Logo Preview">
                                <div class="text-left">
                                    <p id="logo-file-name" class="text-xs font-semibold text-slate-700 truncate max-w-[160px]">logo.png</p>
                                    <p class="text-[10px] text-slate-400">Custom logo attached</p>
                                </div>
                            </div>
                            <button type="button" id="remove-logo-btn" class="p-2 hover:bg-slate-200/60 rounded-lg text-slate-400 hover:text-red-500 transition-colors" title="Remove logo">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Logo Controls -->
                    <div id="logo-controls" class="hidden grid grid-cols-2 gap-4 pt-1">
                        <div class="space-y-1.5">
                            <div class="flex justify-between items-center text-xs font-medium text-slate-600">
                                <label for="logo-size">Logo Size</label>
                                <span id="logo-size-label">22%</span>
                            </div>
                            <input type="range" id="logo-size" min="10" max="35" value="22" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-600">
                        </div>

                        <div class="space-y-1.5">
                            <label for="logo-shape" class="block text-xs font-medium text-slate-600">Badge Background</label>
                            <select id="logo-shape" class="w-full text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                                <option value="rounded">Rounded Square</option>
                                <option value="circle">Circle</option>
                                <option value="square">Square</option>
                                <option value="none">None (Transparent)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Error Correction -->
                <div class="space-y-3">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <i data-lucide="shield-check" class="w-4 h-4 text-slate-400"></i> Error Correction
                        <span class="text-xs font-normal text-slate-400 ml-auto" title="Higher levels allow the QR code to be readable even if dirty, damaged, or covered by a logo.">What's this?</span>
                    </label>
                    <div class="grid grid-cols-4 gap-2 bg-slate-100/50 p-1 rounded-xl">
                        <button class="level-btn active bg-white shadow-sm rounded-lg py-2 text-sm font-medium text-slate-800 input-transition border border-slate-200/60" data-level="L">Low</button>
                        <button class="level-btn text-slate-500 hover:text-slate-800 rounded-lg py-2 text-sm font-medium input-transition border border-transparent" data-level="M">Med</button>
                        <button class="level-btn text-slate-500 hover:text-slate-800 rounded-lg py-2 text-sm font-medium input-transition border border-transparent" data-level="Q">High</button>
                        <button class="level-btn text-slate-500 hover:text-slate-800 rounded-lg py-2 text-sm font-medium input-transition border border-transparent" data-level="H">Max</button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Preview & Export -->
            <div class="md:col-span-5 bg-slate-50/50 p-6 md:p-10 flex flex-col items-center justify-center relative">
                
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/60 mb-8 relative group">
                    <!-- Container where QRCodeJS will inject the canvas -->
                    <div id="qr-container" class="w-48 h-48 sm:w-56 sm:h-56 relative z-10"></div>
                    
                    <!-- Empty state overlay -->
                    <div id="empty-state" class="absolute inset-0 z-20 bg-white backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
                        <i data-lucide="qr-code" class="w-10 h-10 text-slate-300 mb-2"></i>
                        <span class="text-sm text-slate-400 font-medium">Awaiting content...</span>
                    </div>
                </div>

                <!-- Export Actions -->
                <div class="w-full max-w-xs grid grid-cols-2 gap-3">
                    <button onclick="copyToClipboard()" class="flex items-center justify-center gap-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 py-3 px-4 rounded-xl font-medium shadow-sm input-transition">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copy
                    </button>
                    <button onclick="downloadQR()" class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white py-3 px-4 rounded-xl font-medium shadow-sm input-transition">
                        <i data-lucide="download" class="w-4 h-4"></i> Save PNG
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // DOM Elements
        const dataInput = document.getElementById('qr-data');
        const colorDarkInput = document.getElementById('color-dark');
        const colorLightInput = document.getElementById('color-light');
        const colorDarkLabel = document.getElementById('color-dark-label');
        const colorLightLabel = document.getElementById('color-light-label');
        const levelBtns = document.querySelectorAll('.level-btn');
        const qrContainer = document.getElementById('qr-container');
        const emptyState = document.getElementById('empty-state');

        // Logo DOM Elements
        const logoDropzone = document.getElementById('logo-dropzone');
        const logoFileInput = document.getElementById('logo-file');
        const logoUploadPrompt = document.getElementById('logo-upload-prompt');
        const logoPreviewContainer = document.getElementById('logo-preview-container');
        const logoPreviewImg = document.getElementById('logo-preview-img');
        const logoFileName = document.getElementById('logo-file-name');
        const removeLogoBtn = document.getElementById('remove-logo-btn');
        const logoControls = document.getElementById('logo-controls');
        const logoSizeInput = document.getElementById('logo-size');
        const logoSizeLabel = document.getElementById('logo-size-label');
        const logoShapeSelect = document.getElementById('logo-shape');
        
        // State
        let currentOptions = {
            colorDark: '#0f172a',
            colorLight: '#ffffff',
            correctLevel: 'L',
            logoScale: 22,
            logoShape: 'rounded'
        };
        let logoImage = null;

        // Helper to grab the internally generated canvas
        const getGeneratedCanvas = () => qrContainer.querySelector('canvas');

        // Render uploaded logo directly onto the generated QR canvas
        const renderLogoOnCanvas = (canvas) => {
            if (!logoImage) return;

            const ctx = canvas.getContext('2d');
            const canvasWidth = canvas.width;
            const canvasHeight = canvas.height;

            const scale = currentOptions.logoScale / 100;
            const logoSize = canvasWidth * scale;
            const x = (canvasWidth - logoSize) / 2;
            const y = (canvasHeight - logoSize) / 2;

            // Optional padding badge shape behind logo to mask QR modules
            const padding = logoSize * 0.15;
            const bgSize = logoSize + padding;
            const bgX = (canvasWidth - bgSize) / 2;
            const bgY = (canvasHeight - bgSize) / 2;

            ctx.save();

            if (currentOptions.logoShape !== 'none') {
                ctx.fillStyle = currentOptions.colorLight;
                
                if (currentOptions.logoShape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(canvasWidth / 2, canvasHeight / 2, bgSize / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (currentOptions.logoShape === 'rounded') {
                    const radius = bgSize * 0.2;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(bgX, bgY, bgSize, bgSize, radius);
                    } else {
                        ctx.rect(bgX, bgY, bgSize, bgSize);
                    }
                    ctx.fill();
                } else if (currentOptions.logoShape === 'square') {
                    ctx.fillRect(bgX, bgY, bgSize, bgSize);
                }
            }

            // Draw logo image in center
            ctx.drawImage(logoImage, x, y, logoSize, logoSize);
            ctx.restore();

            // Sync updated canvas to img tag if qrcodejs renders an img
            const imgEl = qrContainer.querySelector('img');
            if (imgEl) {
                imgEl.src = canvas.toDataURL('image/png');
            }
        };

        // Real-time updates
        const updateQR = () => {
            if (typeof QRCode === 'undefined') {
                console.warn('QR Code library is still loading...');
                return;
            }

            const text = dataInput.value.trim();
            
            if (!text) {
                emptyState.classList.remove('opacity-0');
                emptyState.classList.add('opacity-100');
                qrContainer.innerHTML = ''; // Clear DOM
                return;
            } else {
                emptyState.classList.add('opacity-0');
                emptyState.classList.remove('opacity-100');
            }

            // Clear previous QR code
            qrContainer.innerHTML = '';

            // Map string levels to QRCodejs Constants
            const levelMap = {
                'L': QRCode.CorrectLevel.L,
                'M': QRCode.CorrectLevel.M,
                'Q': QRCode.CorrectLevel.Q,
                'H': QRCode.CorrectLevel.H
            };

            try {
                // Generate new QR code (High resolution internally, scaled down by CSS)
                new QRCode(qrContainer, {
                    text: text,
                    width: 1000, 
                    height: 1000,
                    colorDark : currentOptions.colorDark,
                    colorLight : currentOptions.colorLight,
                    correctLevel : levelMap[currentOptions.correctLevel] || QRCode.CorrectLevel.L
                });

                // Apply Logo if present
                const canvas = getGeneratedCanvas();
                if (canvas && logoImage) {
                    renderLogoOnCanvas(canvas);
                }
            } catch (err) {
                console.error(err);
                showToast('Text too long for this error correction level.', 'error');
            }
        };

        // Helper to update Error Correction Level UI
        const setCorrectLevel = (level) => {
            currentOptions.correctLevel = level;
            levelBtns.forEach(btn => {
                if (btn.dataset.level === level) {
                    btn.classList.remove('text-slate-500', 'border-transparent');
                    btn.classList.add('bg-white', 'shadow-sm', 'border-slate-200/60', 'text-slate-800');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'border-slate-200/60', 'text-slate-800');
                    btn.classList.add('text-slate-500', 'border-transparent');
                }
            });
        };

        // File Handler for Logo Upload
        const handleLogoFile = (file) => {
            if (!file.type.startsWith('image/')) {
                showToast('Please upload a valid image file', 'error');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showToast('Image size should be less than 5MB', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    logoImage = img;
                    
                    logoPreviewImg.src = e.target.result;
                    logoFileName.textContent = file.name;
                    logoUploadPrompt.classList.add('hidden');
                    logoPreviewContainer.classList.remove('hidden');
                    logoPreviewContainer.classList.add('flex');
                    logoControls.classList.remove('hidden');

                    // Recommend higher error correction when adding a logo
                    if (currentOptions.correctLevel === 'L' || currentOptions.correctLevel === 'M') {
                        setCorrectLevel('H');
                        showToast('Set error correction to High for logo readability', 'success');
                    } else {
                        showToast('Logo attached successfully', 'success');
                    }

                    updateQR();
                };
                img.onerror = () => showToast('Failed to load image', 'error');
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // Remove Logo Function
        const removeLogo = () => {
            logoImage = null;
            logoFileInput.value = '';
            logoPreviewImg.src = '';
            logoFileName.textContent = '';
            
            logoUploadPrompt.classList.remove('hidden');
            logoPreviewContainer.classList.add('hidden');
            logoPreviewContainer.classList.remove('flex');
            logoControls.classList.add('hidden');

            showToast('Logo removed', 'success');
            updateQR();
        };

        // Listeners for Content and Color Inputs
        dataInput.addEventListener('input', updateQR);
        
        colorDarkInput.addEventListener('input', (e) => {
            currentOptions.colorDark = e.target.value;
            colorDarkLabel.textContent = e.target.value.toUpperCase();
            updateQR();
        });

        colorLightInput.addEventListener('input', (e) => {
            currentOptions.colorLight = e.target.value;
            colorLightLabel.textContent = e.target.value.toUpperCase();
            updateQR();
        });

        // Error Correction Buttons Logic
        levelBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                setCorrectLevel(e.currentTarget.dataset.level);
                updateQR();
            });
        });

        // Logo UI & Drag and Drop Listeners
        logoDropzone.addEventListener('click', (e) => {
            if (e.target.closest('#remove-logo-btn')) return;
            logoFileInput.click();
        });

        removeLogoBtn.addEventListener('click', removeLogo);

        logoFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleLogoFile(e.target.files[0]);
            }
        });

        logoDropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            logoDropzone.classList.add('border-brand-500', 'bg-brand-50/50');
        });

        logoDropzone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            logoDropzone.classList.remove('border-brand-500', 'bg-brand-50/50');
        });

        logoDropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            logoDropzone.classList.remove('border-brand-500', 'bg-brand-50/50');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleLogoFile(e.dataTransfer.files[0]);
            }
        });

        // Logo Customization Controls
        logoSizeInput.addEventListener('input', (e) => {
            currentOptions.logoScale = parseInt(e.target.value, 10);
            logoSizeLabel.textContent = `${currentOptions.logoScale}%`;
            updateQR();
        });

        logoShapeSelect.addEventListener('change', (e) => {
            currentOptions.logoShape = e.target.value;
            updateQR();
        });

        // Export Functions
        const downloadQR = () => {
            if (!dataInput.value.trim()) return showToast('Nothing to download', 'error');
            
            const canvas = getGeneratedCanvas();
            if (!canvas) return showToast('QR Code not ready yet', 'error');

            const link = document.createElement('a');
            link.download = `qrcode_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(`Downloaded High-Res PNG`, 'success');
        };

        // Clipboard Function (modern async)
        const copyToClipboard = async () => {
            if (!dataInput.value.trim()) return showToast('Nothing to copy', 'error');
            
            const canvas = getGeneratedCanvas();
            if (!canvas) return showToast('QR Code not ready yet', 'error');

            try {
                canvas.toBlob(async (blob) => {
                    try {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        showToast('Copied to clipboard!', 'success');
                    } catch (err) {
                        console.error('Clipboard write error:', err);
                        showToast('Unable to copy image. Try downloading.', 'error');
                    }
                }, 'image/png');
            } catch (err) {
                console.error(err);
                showToast('Clipboard API not supported here', 'error');
            }
        };

        // Custom Toast Notification System
        const toastContainer = document.getElementById('toast-container');
        const showToast = (message, type = 'success') => {
            const toast = document.createElement('div');
            
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-full shadow-lg border toast-enter pointer-events-auto bg-white/90 backdrop-blur-md`;
            let iconColor = type === 'success' ? 'text-green-500' : 'text-red-500';
            let iconName = type === 'success' ? 'check-circle-2' : 'alert-circle';
            
            toast.innerHTML = `
                <i data-lucide="${iconName}" class="w-5 h-5 ${iconColor}"></i>
                <span class="text-sm font-medium text-slate-700">${message}</span>
            `;
            
            toastContainer.appendChild(toast);
            lucide.createIcons({ root: toast });

            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                toast.addEventListener('animationend', () => toast.remove());
            }, 3000);
        };

        // Initial Generation with loading fallback
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof QRCode !== 'undefined') {
                updateQR();
            } else {
                let attempts = 0;
                const checkReady = setInterval(() => {
                    if (typeof QRCode !== 'undefined') {
                        clearInterval(checkReady);
                        updateQR();
                    } else if (attempts > 100) { 
                        clearInterval(checkReady);
                        showToast('Failed to load QR Code library. Check connection.', 'error');
                    }
                    attempts++;
                }, 100);
            }
        });

    </script>
</body>
</html>
